<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wastech – Falas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12201a; --text:#f1efe6; --muted:#9fb3a6; --line:#2a3d33;
  --go:#2fa84f; --back:#d64541;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{ --bg:#f6f4ec; --text:#1d2a22; --muted:#5d6e63; --line:#d8d4c6; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--text);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-user-select:none; user-select:none; touch-action:pan-y;
}
header{
  display:flex; align-items:center; gap:.75rem;
  padding:.75rem 1rem .5rem;
}
.count{font-weight:700;font-size:1rem;min-width:3.5rem;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);width:0;transition:width .25s}
.tools{display:flex;gap:.35rem}
.tools button{
  background:transparent;color:var(--muted);border:1px solid var(--line);
  border-radius:8px;font:700 .95rem/1 inherit;padding:.45rem .6rem;min-width:2.4rem;
}
main{flex:1;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .3s ease}
.slide{
  flex:0 0 100%; height:100%; overflow-y:auto;
  padding:1rem 1.25rem 2rem;
}
.slide p{
  margin:0; font-size:var(--fs,1.45rem); line-height:1.55;
  max-width:36em; text-wrap:pretty;
}
footer{
  display:grid; grid-template-columns:1fr 2fr; gap:.75rem;
  padding:.75rem 1rem 1rem;
}
footer button{
  border:0;border-radius:14px;color:#fff;
  font:700 1.15rem/1 inherit; padding:1.15rem 0;
}
#prev{background:var(--back)}
#next{background:var(--go)}
footer button:disabled{opacity:.35}
footer button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.track,.bar i{transition:none}}
</style>
</head>
<body>
<header>
  <span class="count" id="count">1 / 10</span>
  <div class="bar"><i id="bar"></i></div>
  <div class="tools">
    <button id="smaller" aria-label="Diminuir texto">A−</button>
    <button id="bigger" aria-label="Aumentar texto">A+</button>
    <button id="theme" aria-label="Alternar tema claro/escuro">◐</button>
  </div>
</header>

<main><div class="track" id="track"></div></main>

<footer>
  <button id="prev">Voltar</button>
  <button id="next">Próxima</button>
</footer>

<script>
const falas = [
`Boa noite todos! Me chamo Kaliandrik e faço parte da equipe Wastech. E para começar gostaria de fazer uma pergunta reflexiva. Já imaginaram tomar decisões vitais para uma lavoura inteiramente no escuro, baseando-se apenas na intuição ou na sorte? Essa é a realidade diária de milhares de produtores. Nós somos a Wastech, e viemos mostrar como a agricultura inteligente baseada em dados pode transformar esse cenário.`,
`Conheçam o João. Ele representa o pequeno e médio agricultor rural. O João sofre diariamente com a falta de previsibilidade: o clima está cada vez mais incerto, gerando perdas constantes na colheita. Ele desperdiça água por não ter cálculos exatos e ainda vive sob a ameaça constante de incêndios em épocas secas. A ausência de dados climáticos precisos não é apenas um problema de produtividade; ela gera prejuízos financeiros severos e um enorme impacto ambiental.`,
`Estamos falando de um mercado colossal. Só no Brasil, o setor de agricultura inteligente movimenta 435 milhões de dólares, e no mundo já ultrapassa 260 bilhões. A nossa proposta de valor é clara: transformar dados climáticos complexos em decisões exatas para pequenos agricultores. Entregamos monitoramento do clima em tempo real, irrigação baseada em coeficientes científicos e prevenção ativa contra o fogo.`,
`Como fazemos isso? Através do Aplicativo Wastech. O caminho do nosso usuário é simples: ele faz o download gratuito da plataforma. A partir daí, o app se conecta via API com o Open Weather para captação de dados de satélite e IoT. O sistema calcula o coeficiente de cultura — o famoso Kc —, indicando o volume exato de irrigação que a planta precisa. Além disso, mapeia zonas de risco de incêndio. Monetizamos através de assinaturas para recursos premium e integração de hardware.`,
`Navegando pela interface, o produtor tem tudo na palma da mão. Na Home, ele acompanha o ciclo das suas culturas, como o milho. No Mapa de Incêndio, ele visualiza em tempo real focos de calor próximos, área afetada e intensidade. E na aba de Irrigação, o sistema calcula com precisão milimétrica a evapotranspiração, cruzando dados de solo e planta para otimizar o uso da água e economizar recursos.`,
`E não paramos no software. Nossa plataforma se conecta a hardwares de campo preparados para ler a realidade daquela localidade exata: medindo a umidade do solo a 40 centímetros de profundidade, temperatura do ar e precipitação dos últimos dias.`,
`Quando olhamos para a competição, nossa grande vantagem competitiva está em unir o foco profundo no pequeno e médio agricultor, combinando clima, cálculo preciso de irrigação via Kc, alerta de incêndio e gratuidade inicial via API, superando soluções tradicionais do mercado.`,
`O nosso futuro já começou. Nos próximos passos, vamos integrar Inteligência Artificial por câmera para identificação automática de pragas e mudanças climáticas, além de expandir nossa captação de dados direto do solo em forte parceria com cooperativas locais.`,
`Tudo isso é construído por uma equipe multidisciplinar altamente qualificada: Emanuel no desenvolvimento, Antônio na gestão de qualidade, Kaliandrik em hardware e sensores, e Marcio na gerência de produto.`,
`Plante inteligência e colha o futuro com a Wastech. Escaneie o QR Code na tela, conecte-se com a gente no Instagram @wastechofc e venha fazer parte dessa revolução no campo. Muito obrigado!`
];

const track = document.getElementById('track');
falas.forEach(t => {
  const s = document.createElement('section');
  s.className = 'slide';
  const p = document.createElement('p');
  p.textContent = t;
  s.appendChild(p);
  track.appendChild(s);
});

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

let i = 0;
let fs = parseFloat(store.get('fs')) || 1.45;

function render(){
  track.style.transform = `translateX(${-i*100}%)`;
  $('count').textContent = `${i+1} / ${falas.length}`;
  $('bar').style.width = `${((i+1)/falas.length)*100}%`;
  $('prev').disabled = i === 0;
  $('next').disabled = i === falas.length-1;
  $('next').textContent = i === falas.length-1 ? 'Fim' : 'Próxima';
  track.children[i].scrollTop = 0;
  store.set('idx', i);
}
function go(d){
  const n = Math.min(falas.length-1, Math.max(0, i+d));
  if(n !== i){ i = n; render(); if(navigator.vibrate) navigator.vibrate(15); }
}
function applyFs(){
  document.documentElement.style.setProperty('--fs', fs+'rem');
  store.set('fs', fs);
}

$('next').onclick = () => go(1);
$('prev').onclick = () => go(-1);
$('bigger').onclick = () => { fs = Math.min(2.6, fs+0.1); applyFs(); };
$('smaller').onclick = () => { fs = Math.max(1, fs-0.1); applyFs(); };
$('theme').onclick = () => {
  const r = document.documentElement;
  const t = r.dataset.theme === 'light' ? 'dark' : 'light';
  r.dataset.theme = t; store.set('theme', t);
};

// Deslizar para os lados
let sx=0, sy=0;
document.addEventListener('touchstart', e => { sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3) go(dx < 0 ? 1 : -1);
}, {passive:true});

// Teclado (caso use no computador)
document.addEventListener('keydown', e => {
  if(['ArrowRight',' ','PageDown'].includes(e.key)) go(1);
  if(['ArrowLeft','PageUp'].includes(e.key)) go(-1);
});

// Manter a tela ligada
let lock=null;
async function keepAwake(){
  try{ if('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') keepAwake(); });
document.addEventListener('click', keepAwake, {once:true});
keepAwake();

const savedTheme = store.get('theme');
if(savedTheme) document.documentElement.dataset.theme = savedTheme;
const savedIdx = parseInt(store.get('idx'));
if(!isNaN(savedIdx) && savedIdx < falas.length) i = savedIdx;
applyFs();
render();
</script>
</body>
</html>
